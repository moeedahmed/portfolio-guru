<form><fieldset><legend>Training</legend>
<label for="stage">Stage of training</label><select id="stage" required>
<option value="">Choose</option><option value="early">Early</option><option value="higher">Higher</option>
<option value="retired" disabled>Retired</option></select>
<label for="date">Date of event</label><input id="date" type="date">
<label>Evidence retained<input id="retained" type="checkbox"></label>
</fieldset><fieldset><legend>Setting</legend>
<label><input name="setting" type="radio" value="simulation" required>Simulation</label>
<input id="clinical" name="setting" type="radio" value="clinical"><label for="clinical">Clinical</label>
</fieldset></form>
